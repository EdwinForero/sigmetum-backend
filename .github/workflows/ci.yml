# Integración continua: ejecuta la definición de terminado de docs/guias/buenas-practicas-backend.md.
# npm test no se incluye todavía: hoy es el placeholder de "npm init" y siempre falla (ver M11 en
# docs/07-estado-y-deuda-tecnica.md). Se añadirá aquí cuando existan tests reales. Si cambias un paso
# aquí, cámbialo también en CLAUDE.md y en las guías (npm run docs:check comprueba que los comandos
# citados en la documentación existen en package.json).

name: CI

on:
  pull_request:
  push:
    branches: [master, feature/sigmetum_v2]
  schedule:
    # Cada lunes: detecta vulnerabilidades nuevas en las dependencias (npm audit) aunque no haya cambios de código.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # required for OIDC authentication with AWS

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Calidad y documentación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 22: el mismo que usa Elastic Beanstalk (ver docs/integracion/para-infra.md).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Calidad y seguridad
        run: npm run quality

      - name: Documentación al día
        run: npm run docs:check

      # - name: Tests
      #   run: npm test
      # Pendiente de activar cuando exista una suite de tests real (M11).

  deploy:
    name: Deploy a Beanstalk
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    timeout-minutes: 20

    env:
      AWS_REGION: eu-west-3

    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar entorno
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "role=${{ vars.AWS_ROLE_PROD }}" >> "$GITHUB_OUTPUT"
            echo "bucket=${{ vars.S3_BUCKET_PROD }}" >> "$GITHUB_OUTPUT"
            echo "app=sigmetum-backend-prod" >> "$GITHUB_OUTPUT"
            echo "eb_env=sigmetum-backend-prod-env" >> "$GITHUB_OUTPUT"
          else
            echo "role=${{ vars.AWS_ROLE_DEV }}" >> "$GITHUB_OUTPUT"
            echo "bucket=${{ vars.S3_BUCKET_DEV }}" >> "$GITHUB_OUTPUT"
            echo "app=sigmetum-backend-dev" >> "$GITHUB_OUTPUT"
            echo "eb_env=sigmetum-backend-dev-env" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Empaquetar código fuente
        run: |
          zip -r deploy.zip . \
            --exclude "node_modules/*" \
            --exclude ".git/*" \
            --exclude "*.env*" \
            --exclude ".claude/*" \
            --exclude "docs/*"

      - name: Subir artefacto a S3
        run: |
          aws s3 cp deploy.zip \
            s3://${{ steps.env.outputs.bucket }}/${{ github.sha }}.zip

      - name: Crear versión en Beanstalk
        run: |
          # Si el label ya existe (re-push del mismo commit), la llamada falla con
          # InvalidParameterValue. Lo ignoramos y usamos la versión existente.
          aws elasticbeanstalk create-application-version \
            --application-name ${{ steps.env.outputs.app }} \
            --version-label ${{ github.sha }} \
            --source-bundle S3Bucket=${{ steps.env.outputs.bucket }},S3Key=${{ github.sha }}.zip \
            --region ${{ env.AWS_REGION }} || true

      - name: Desplegar en el entorno
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name ${{ steps.env.outputs.eb_env }} \
            --version-label ${{ github.sha }} \
            --region ${{ env.AWS_REGION }}

      - name: Esperar a que el entorno esté listo
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-names ${{ steps.env.outputs.eb_env }} \
            --region ${{ env.AWS_REGION }}
